spring:
  application:
    name: oriontask
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false

server:
  error:
    include-binding-errors: never
    include-message: never
    include-stacktrace: never

oriontask:
  security:
    session-hmac-key: ${ORIONTASK_SESSION_HMAC_KEY}
    trusted-proxies: ${ORIONTASK_TRUSTED_PROXIES:}
