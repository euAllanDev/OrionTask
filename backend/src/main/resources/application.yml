spring:
  application:
    name: oriontask
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
        path: /
  error:
    include-binding-errors: never
    include-message: never
    include-stacktrace: never

oriontask:
  security:
    session-hmac-key: ${ORIONTASK_SESSION_HMAC_KEY}
    invitation-hmac-key: ${ORIONTASK_INVITATION_HMAC_KEY:${oriontask.security.session-hmac-key}}
    trusted-proxies: ${ORIONTASK_TRUSTED_PROXIES:}
